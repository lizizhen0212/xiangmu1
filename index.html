<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习工作台 · 日历</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">日</span>
        <div class="brand__text">
          <h1 class="brand__title">学习工作台</h1>
          <p class="brand__sub">模块 A · 学习日历　|　模块 C · 事件提醒</p>
        </div>
      </div>
      <button class="btn btn--ghost" id="todayBtn" type="button">回到今天</button>
    </header>

    <div class="notice" id="notice" hidden>
      <span class="notice__icon" aria-hidden="true">⚠</span>
      <span class="notice__text" id="noticeText"></span>
      <button class="btn btn--mini" id="noticeClose" type="button">知道了</button>
    </div>

    <main class="board">
      <div class="board__head">
        <div class="month-nav">
          <button class="btn btn--icon" id="prevBtn" type="button" aria-label="上一个月">‹</button>
          <h2 class="month-nav__label" id="monthLabel">—</h2>
          <button class="btn btn--icon" id="nextBtn" type="button" aria-label="下一个月">›</button>
        </div>
        <p class="board__meta" id="monthMeta"></p>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>一</span><span>二</span><span>三</span><span>四</span>
        <span>五</span><span>六</span><span>日</span>
      </div>

      <div class="grid" id="grid" aria-label="月历"></div>

      <p class="empty-hint" id="emptyHint" hidden>这个月还没有记录，点任意一天开始写吧。</p>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="panel" id="panel" aria-hidden="true" aria-labelledby="panelDate">
    <header class="panel__head">
      <h2 class="panel__date" id="panelDate"></h2>
      <button class="btn btn--icon" id="closeBtn" type="button" aria-label="关闭">✕</button>
    </header>

    <div class="panel__body">
      <label class="field">
        <span class="field__label">备忘</span>
        <textarea class="field__input" id="memo" rows="5" placeholder="今天要完成什么…"></textarea>
      </label>
      <p class="panel__hint" id="saveHint">输入即自动保存</p>

      <section class="panel__section">
        <div class="section-head">
          <h3 class="panel__sectionTitle">事件</h3>
          <button class="btn btn--mini" id="addEventBtn" type="button">＋ 新建</button>
        </div>

        <ul class="agenda" id="agendaList"></ul>

        <form class="event-form" id="eventForm" hidden>
          <label class="field field--tight">
            <span class="field__label">做什么</span>
            <input class="field__input field__input--single" id="evtTitle" type="text" maxlength="60" placeholder="例如：交线代作业" />
          </label>

          <label class="field field--tight">
            <span class="field__label">截止时间</span>
            <input class="field__input field__input--single" id="evtDue" type="datetime-local" />
          </label>

          <fieldset class="offsets">
            <legend class="field__label">提前提醒</legend>
            <label class="offsets__item"><input type="checkbox" value="720" /> 12 小时</label>
            <label class="offsets__item"><input type="checkbox" value="180" /> 3 小时</label>
            <label class="offsets__item"><input type="checkbox" value="60" /> 1 小时</label>
            <label class="offsets__item"><input type="checkbox" value="30" /> 30 分钟</label>
          </fieldset>

          <p class="form-error" id="formError" hidden></p>

          <div class="event-form__actions">
            <button class="btn" id="evtCancel" type="button">取消</button>
            <button class="btn btn--primary" id="evtSave" type="submit">保存</button>
          </div>

          <button class="btn btn--ghost btn--block" id="notifyBtn" type="button" hidden>开启系统通知</button>
        </form>
      </section>
    </div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
